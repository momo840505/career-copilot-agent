name: CI

# Two-tier CI, deliberately: unit-tests runs on every push/PR, needs no secret, and
# costs nothing — it's the fast, always-on gate. eval-gate runs the golden JD set
# through the real OpenAI API, so it only runs where a secret is actually available
# (push to main, manual dispatch, or the weekly schedule) — never on an external PR,
# which wouldn't have the secret anyway, and never on every commit, which would burn
# API cost for no reason. This mirrors the same "cheap deterministic checks vs. real
# API calls" split as career_copilot/eval/metrics.py vs. groundedness_judge.py.

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC — catches silent regressions
      # (a model swap, an upstream langgraph/langchain release) without spending API
      # cost on every commit.

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -m "not requires_api"

  eval-gate:
    needs: unit-tests
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Not secrets (just model names) -- repo Variables, not Secrets. Defaulted here
      # too (the `|| '...'` fallback), matching .env.example's recommendation, so this
      # workflow can't silently drift back to a stricter/cheaper default than whatever
      # is actually being developed against locally, the way it did once already: the
      # first real eval-gate run failed all 3 golden JDs on critic_converged because
      # OPENAI_CRITIC_MODEL wasn't set here, so the critic silently ran as the
      # default gpt-4o-mini instead of the gpt-4o configured in the local .env --
      # .env.example itself already documents gpt-4o-mini as "can be over-strict" for
      # the critic specifically, which is exactly what happened.
      OPENAI_CHAT_MODEL: ${{ vars.OPENAI_CHAT_MODEL || 'gpt-4o-mini' }}
      OPENAI_CRITIC_MODEL: ${{ vars.OPENAI_CRITIC_MODEL || 'gpt-4o' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: python scripts/build_index.py
      - run: python scripts/run_evals.py

  docker-smoke:
    # Same gating as eval-gate, for the same reason: building the real image and
    # booting it re-runs docker/entrypoint.sh's index build against the real OpenAI
    # embeddings API, so this needs the same secret and the same
    # not-on-every-external-PR guard. Catches a class of bug unit-tests/eval-gate
    # can't -- a broken Dockerfile, a missing file in a COPY, a container that can't
    # actually start -- since those never run through pip installing straight into
    # the runner.
    needs: unit-tests
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t career-copilot-agent:ci .
      - name: Boot the image and wait for /health
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          docker run -d --name cc-smoke -p 8000:8000 \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            career-copilot-agent:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Container came up healthy after ${i} check(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy within 60s -- dumping logs:"
          docker logs cc-smoke
          exit 1
      - name: Clean up the container
        if: always()
        run: docker rm -f cc-smoke || true
