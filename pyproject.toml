[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-copilot"
version = "0.1.0"
description = "Evidence-grounded job application assistant built with LangGraph, RAG, and MCP."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
career_copilot = [
    "data/portfolio/*.md",
    "data/golden_jds/*.txt",
]

[tool.ruff]
line-length = 100
